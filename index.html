<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>九图草稿 · 一键复制</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f5f1;color:#24231f;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif}.app{max-width:520px;margin:auto;min-height:100vh;padding:18px 16px 165px}.top{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 20px}.top h1{font-size:25px;margin:0}.tag{font-size:12px;background:#e7eee6;color:#4b6450;padding:7px 10px;border-radius:99px}.card{background:#fff;border-radius:20px;padding:16px;box-shadow:0 5px 25px rgba(42,38,28,.06);margin-bottom:14px}.label{font-size:13px;color:#777268;margin-bottom:9px}.title{width:100%;border:0;background:#f5f4f0;border-radius:12px;padding:13px;font-size:16px;outline:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.item{position:relative;aspect-ratio:3/4;border-radius:13px;overflow:hidden;background:#eee}.item img{width:100%;height:100%;object-fit:cover;display:block}.num{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.55);color:#fff;border-radius:99px;padding:3px 7px;font-size:11px}.del{position:absolute;right:5px;top:5px;border:0;width:25px;height:25px;border-radius:50%;background:rgba(255,255,255,.9);font-size:17px}.move{position:absolute;left:5px;right:5px;bottom:5px;display:flex;justify-content:space-between}.move button{border:0;background:rgba(255,255,255,.88);border-radius:9px;padding:5px 9px}.add{border:1.5px dashed #c9c5ba;display:flex;align-items:center;justify-content:center;color:#898478;font-size:30px}.hint{font-size:12px;color:#999286;margin-top:10px}.row{display:flex;gap:8px}.chip{flex:1;border:1px solid #e6e2d9;background:#fff;border-radius:12px;padding:10px 5px;text-align:center;font-size:13px}.chip.on{background:#26251f;color:white;border-color:#26251f}.preview{background:white;padding:12px;border-radius:14px;max-height:520px;overflow:auto}.preview-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:start}.preview-grid img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;border-radius:2px}.bottom{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(246,245,241,.94);backdrop-filter:blur(15px)}.actions{max-width:488px;margin:auto;display:grid;grid-template-columns:1fr 2fr;gap:8px}.btn{border:0;border-radius:15px;height:52px;font-size:15px;font-weight:600}.primary{background:#24231f;color:#fff}.secondary{background:#fff;color:#24231f;border:1px solid #ddd8cd}.small{margin-top:8px;font-size:11px;color:#8d887d;text-align:center}#file{display:none}.empty{color:#aaa;text-align:center;padding:30px 0;font-size:14px}#copyStage{position:fixed;left:-10000px;top:0;width:720px;background:#fff;z-index:-1}.manual{display:none;margin-top:12px;border:1px dashed #c9c5ba;border-radius:14px;padding:12px}.manual.show{display:block}.manual-note{font-size:12px;color:#777268;margin-bottom:8px}.manual-content{background:#fff;overflow:hidden}.manual-content table{width:100%;border-collapse:collapse;table-layout:fixed}.manual-content img{width:100%;height:auto;display:block}
</style></head><body><div class="app">
<div class="top"><h1>九图草稿</h1><span class="tag">V4 · 一键复制</span></div>
<div class="card"><div class="label">文章标题</div><input class="title" id="title" placeholder="输入公众号文章标题"></div>
<div class="card"><div class="label">图片顺序 <span id="count">0/9</span></div><div class="grid" id="grid"></div><div class="hint">用图片下方 ← → 调整顺序 · 点击 × 删除</div></div>
<div class="card"><div class="label">图片间距</div><div class="row"><button class="chip" data-gap="0">无缝</button><button class="chip" data-gap="8">8 px</button><button class="chip" data-gap="16">16 px</button></div></div>
<div class="card"><div class="label">公众号效果预览 · 每行 3 张</div><div class="preview" id="preview"><div class="empty">选择图片后在这里预览</div></div><div class="manual" id="manual"><div class="manual-note">浏览器没有允许自动复制。请长按/全选下面的排版区域后复制，再到公众号编辑器粘贴。</div><div class="manual-content" id="manualContent" contenteditable="true"></div></div></div>
</div><div class="bottom"><div class="actions"><button class="btn secondary" id="copyTitle">复制标题</button><button class="btn primary" id="copyLayout">一键复制排版</button></div><div class="small">复制后直接到公众号助手/公众号编辑器粘贴；无需 AppSecret 或 Cloudflare</div></div><input type="file" id="file" accept="image/*" multiple><div id="copyStage" aria-hidden="true"></div>
<script>
let items=[],gap=+(localStorage.getItem('gap')||0);const $=s=>document.querySelector(s),grid=$('#grid'),preview=$('#preview'),file=$('#file'),title=$('#title'),manual=$('#manual'),manualContent=$('#manualContent'),copyStage=$('#copyStage');title.value=localStorage.getItem('title')||'';title.oninput=()=>localStorage.setItem('title',title.value);
function swap(a,b){if(b<0||b>=items.length)return;[items[a],items[b]]=[items[b],items[a]];render()}
function render(){grid.innerHTML='';items.forEach((o,i)=>{let d=document.createElement('div');d.className='item';d.innerHTML=`<img src="${o.url}"><span class="num">${i+1}</span><button class="del">×</button><div class="move"><button class="l">←</button><button class="r">→</button></div>`;d.querySelector('.del').onclick=()=>{URL.revokeObjectURL(o.url);items.splice(i,1);manual.classList.remove('show');render()};d.querySelector('.l').onclick=()=>swap(i,i-1);d.querySelector('.r').onclick=()=>swap(i,i+1);grid.appendChild(d)});if(items.length<9){let a=document.createElement('div');a.className='item add';a.textContent='＋';a.onclick=()=>file.click();grid.appendChild(a)}$('#count').textContent=`${items.length}/9`;preview.innerHTML=items.length?`<div class="preview-grid" style="gap:${gap}px">${items.map(o=>`<img src="${o.url}">`).join('')}</div>`:'<div class="empty">选择图片后在这里预览</div>';document.querySelectorAll('.chip').forEach(b=>b.classList.toggle('on',+b.dataset.gap===gap))}
file.onchange=()=>{[...file.files].slice(0,9-items.length).forEach(f=>items.push({file:f,url:URL.createObjectURL(f)}));file.value='';manual.classList.remove('show');render()};document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{gap=+b.dataset.gap;localStorage.setItem('gap',gap);manual.classList.remove('show');render()});
function fileToDataURL(f){return new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)})}
function esc(s){return String(s).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}
function buildTable(urls){let rows='';for(let r=0;r<urls.length;r+=3){let cells='';for(let c=0;c<3;c++){const src=urls[r+c];if(src){const left=c?gap:0,top=r?gap:0;cells+=`<td style="width:33.333%;padding:${top}px 0 0 ${left}px;vertical-align:top;line-height:0;font-size:0"><img src="${src}" style="display:block;width:100%;height:auto;margin:0;border:0" alt=""></td>`}else cells+='<td style="width:33.333%;padding:0"></td>'}rows+=`<tr>${cells}</tr>`}return `<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="width:100%;border-collapse:collapse;border-spacing:0;table-layout:fixed;margin:0;padding:0"><tbody>${rows}</tbody></table>`}
async function richCopy(html,plain){if(!navigator.clipboard||!window.ClipboardItem)return false;try{const item=new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([plain],{type:'text/plain'})});await navigator.clipboard.write([item]);return true}catch(e){return false}}
function legacyCopy(html){copyStage.innerHTML=html;const range=document.createRange();range.selectNodeContents(copyStage);const sel=window.getSelection();sel.removeAllRanges();sel.addRange(range);let ok=false;try{ok=document.execCommand('copy')}catch(e){}sel.removeAllRanges();copyStage.innerHTML='';return ok}
$('#copyTitle').onclick=async()=>{const t=title.value||'';try{await navigator.clipboard.writeText(t);alert('标题已复制')}catch(e){title.focus();title.select();try{document.execCommand('copy');alert('标题已复制')}catch(_){alert('请长按标题手动复制')}}};
$('#copyLayout').onclick=async()=>{if(!items.length)return alert('请先选择图片');const btn=$('#copyLayout'),old=btn.textContent;btn.disabled=true;btn.textContent='正在生成…';manual.classList.remove('show');try{const urls=await Promise.all(items.map(o=>fileToDataURL(o.file)));const table=buildTable(urls);const html=`<div style="max-width:100%;margin:0;padding:0">${table}</div>`;const plain=(title.value?title.value+'\n':'')+'[九图排版：请使用富文本粘贴]';let ok=await richCopy(html,plain);if(!ok)ok=legacyCopy(html);if(ok){alert('复制成功，请到公众号助手粘贴')}else{manualContent.innerHTML=table;manual.classList.add('show');manual.scrollIntoView({behavior:'smooth',block:'center'});alert('浏览器没有允许自动复制，请长按下方排版区域手动复制')}}catch(e){alert('生成排版失败，请重新选择图片后再试')}finally{btn.disabled=false;btn.textContent=old}};render();
</script></body></html>
