<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>九图草稿 · V4 合成版</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f5f1;color:#24231f;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Helvetica Neue',sans-serif}.app{max-width:520px;margin:auto;min-height:100vh;padding:18px 16px 150px}.top{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 20px}.top h1{font-size:25px;margin:0}.tag{font-size:12px;background:#e7eee6;color:#4b6450;padding:7px 10px;border-radius:99px}.card{background:#fff;border-radius:20px;padding:16px;box-shadow:0 5px 25px rgba(42,38,28,.06);margin-bottom:14px}.label{font-size:13px;color:#777268;margin-bottom:9px}.title{width:100%;border:0;background:#f5f4f0;border-radius:12px;padding:13px;font-size:16px;outline:0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.item{position:relative;aspect-ratio:3/4;border-radius:13px;overflow:hidden;background:#eee}.item img{width:100%;height:100%;object-fit:cover;display:block}.num{position:absolute;left:6px;top:6px;background:rgba(0,0,0,.55);color:#fff;border-radius:99px;padding:3px 7px;font-size:11px}.del{position:absolute;right:5px;top:5px;border:0;width:25px;height:25px;border-radius:50%;background:rgba(255,255,255,.9);font-size:17px}.move{position:absolute;left:5px;right:5px;bottom:5px;display:flex;justify-content:space-between}.move button{border:0;background:rgba(255,255,255,.88);border-radius:9px;padding:5px 9px}.add{border:1.5px dashed #c9c5ba;display:flex;align-items:center;justify-content:center;color:#898478;font-size:30px}.hint{font-size:12px;color:#999286;margin-top:10px}.row{display:flex;gap:8px}.chip{flex:1;border:1px solid #e6e2d9;background:#fff;border-radius:12px;padding:10px 5px;text-align:center;font-size:13px}.chip.on{background:#26251f;color:white;border-color:#26251f}.preview{background:white;padding:12px;border-radius:14px;max-height:520px;overflow:auto}.preview-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:start}.preview-grid img{width:100%;height:auto;display:block;border-radius:2px}.merged-preview{width:100%;height:auto;display:block;border-radius:4px}.bottom{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(246,245,241,.94);backdrop-filter:blur(15px)}.actions{max-width:488px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{border:0;border-radius:15px;height:52px;font-size:15px;font-weight:600}.primary{background:#24231f;color:#fff}.secondary{background:#fff;color:#24231f;border:1px solid #ddd8cd}.small{margin-top:8px;font-size:11px;color:#8d887d;text-align:center}#file{display:none}.empty{color:#aaa;text-align:center;padding:30px 0;font-size:14px}</style></head><body><div class="app">
<div class="top"><h1>九图草稿</h1><span class="tag">V4 · 合成一张</span></div>
<div class="card"><div class="label">文章标题</div><input class="title" id="title" placeholder="输入公众号文章标题"></div>
<div class="card"><div class="label">图片顺序 <span id="count">0/9</span></div><div class="grid" id="grid"></div><div class="hint">用图片下方 ← → 调整顺序 · 点击 × 删除</div></div>
<div class="card"><div class="label">图片间距</div><div class="row"><button class="chip" data-gap="0">无缝</button><button class="chip" data-gap="8">8 px</button><button class="chip" data-gap="16">16 px</button></div></div>
<div class="card"><div class="label">合成效果预览 · 3 × 3</div><div class="preview" id="preview"><div class="empty">选择图片后在这里预览</div></div></div>
</div><div class="bottom"><div class="actions"><button class="btn secondary" id="copy">复制标题</button><button class="btn primary" id="share">生成并分享合成图</button></div><div class="small">9 张图会先在手机本地合成为 1 张普通图片，再调用 iPhone 分享面板</div></div><input type="file" id="file" accept="image/*" multiple>
<script>
let items=[],gap=+(localStorage.getItem('gap')||0);const $=s=>document.querySelector(s),grid=$('#grid'),preview=$('#preview'),file=$('#file'),title=$('#title');title.value=localStorage.getItem('title')||'';title.oninput=()=>localStorage.setItem('title',title.value);
function swap(a,b){if(b<0||b>=items.length)return;[items[a],items[b]]=[items[b],items[a]];render()}
function render(){grid.innerHTML='';items.forEach((o,i)=>{let d=document.createElement('div');d.className='item';d.innerHTML=`<img src="${o.url}"><span class="num">${i+1}</span><button class="del">×</button><div class="move"><button class="l">←</button><button class="r">→</button></div>`;d.querySelector('.del').onclick=()=>{URL.revokeObjectURL(items[i].url);items.splice(i,1);render()};d.querySelector('.l').onclick=()=>swap(i,i-1);d.querySelector('.r').onclick=()=>swap(i,i+1);grid.appendChild(d)});if(items.length<9){let a=document.createElement('div');a.className='item add';a.textContent='＋';a.onclick=()=>file.click();grid.appendChild(a)}$('#count').textContent=`${items.length}/9`;preview.innerHTML=items.length?`<div class="preview-grid" style="gap:${gap}px">${items.map(o=>`<img src="${o.url}">`).join('')}</div>`:'<div class="empty">选择图片后在这里预览</div>';document.querySelectorAll('.chip').forEach(b=>b.classList.toggle('on',+b.dataset.gap===gap))}
file.onchange=()=>{[...file.files].slice(0,9-items.length).forEach(f=>items.push({file:f,url:URL.createObjectURL(f)}));file.value='';render()};document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{gap=+b.dataset.gap;localStorage.setItem('gap',gap);render()});
$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(title.value||'');alert('标题已复制')}catch(e){alert('当前浏览器不允许自动复制，请长按标题复制')}};
function loadImage(file){return new Promise((resolve,reject)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{URL.revokeObjectURL(u);resolve(im)};im.onerror=()=>{URL.revokeObjectURL(u);reject(new Error('图片读取失败'))};im.src=u})}
async function makeMerged(){
 if(items.length!==9) throw new Error('请先选择满 9 张图片');
 const imgs=await Promise.all(items.map(o=>loadImage(o.file)));
 const totalW=1800, colW=Math.floor((totalW-gap*2)/3);
 const scaled=imgs.map(im=>({im,w:colW,h:Math.round(im.naturalHeight*colW/im.naturalWidth)}));
 const rowH=[0,1,2].map(r=>Math.max(...scaled.slice(r*3,r*3+3).map(x=>x.h)));
 const totalH=rowH.reduce((a,b)=>a+b,0)+gap*2;
 const maxPixels=32000000; let scale=Math.min(1,Math.sqrt(maxPixels/(totalW*totalH)));
 const c=document.createElement('canvas');c.width=Math.round(totalW*scale);c.height=Math.round(totalH*scale);
 const ctx=c.getContext('2d');ctx.scale(scale,scale);ctx.fillStyle='#ffffff';ctx.fillRect(0,0,totalW,totalH);
 let y=0;
 for(let r=0;r<3;r++){
   for(let col=0;col<3;col++){
     const x=col*(colW+gap), o=scaled[r*3+col];
     ctx.drawImage(o.im,x,y,o.w,o.h);
   }
   y+=rowH[r]+(r<2?gap:0);
 }
 return new Promise((resolve,reject)=>c.toBlob(b=>b?resolve(b):reject(new Error('合成失败')),'image/jpeg',0.92));
}
$('#share').onclick=async()=>{
 try{
  const btn=$('#share');btn.disabled=true;btn.textContent='正在合成…';
  const blob=await makeMerged();const merged=new File([blob],'wechat-3x3.jpg',{type:'image/jpeg'});
  if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[merged]}))){
    try{await navigator.share({title:title.value||'九图草稿',files:[merged]})}catch(e){if(e.name!=='AbortError')throw e}
  }else{
    const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download='wechat-3x3.jpg';a.click();setTimeout(()=>URL.revokeObjectURL(u),3000);
  }
 }catch(e){alert(e.message||'生成失败，请重试')}finally{const btn=$('#share');btn.disabled=false;btn.textContent='生成并分享合成图'}
};render();
</script></body></html>
